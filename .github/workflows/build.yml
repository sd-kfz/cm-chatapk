name: Build CM-Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Decode the release keystore only if the repo secrets are set. Without
      # them the release build is unsigned; nothing secret is stored in the repo.
      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cmchat.keystore"
          echo "CMCHAT_KEYSTORE=$RUNNER_TEMP/cmchat.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests and build debug and release APKs
        env:
          CMCHAT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CMCHAT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CMCHAT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cm-chat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cm-chat-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
