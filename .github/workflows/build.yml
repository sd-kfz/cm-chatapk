name: Build CM-Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed so the build can publish the signed APKs to a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Decode the real release keystore if the repo secrets are set, and export
      # the signing env for Gradle. Nothing secret is stored in the repo.
      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cmchat.keystore"
          {
            echo "CMCHAT_KEYSTORE=$RUNNER_TEMP/cmchat.keystore"
            echo "CMCHAT_KEYSTORE_PASSWORD=$KS_PW"
            echo "CMCHAT_KEY_ALIAS=$KS_ALIAS"
            echo "CMCHAT_KEY_PASSWORD=$KS_KEY_PW"
          } >> "$GITHUB_ENV"

      # If no real keystore is configured, generate an EPHEMERAL one so the
      # release APKs are signed and therefore installable. NOTE: this key is new
      # on every run, so upgrading in place needs an uninstall until the repo
      # owner configures a stable KEYSTORE_BASE64 secret.
      - name: Generate ephemeral signing key (if none configured)
        if: ${{ env.CMCHAT_KEYSTORE == '' }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/cmchat-ephemeral.keystore" \
            -storepass cmchat -keypass cmchat -alias cmchat \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=CM-Chat, OU=dev, O=CM-Chat, C=US"
          {
            echo "CMCHAT_KEYSTORE=$RUNNER_TEMP/cmchat-ephemeral.keystore"
            echo "CMCHAT_KEYSTORE_PASSWORD=cmchat"
            echo "CMCHAT_KEY_ALIAS=cmchat"
            echo "CMCHAT_KEY_PASSWORD=cmchat"
          } >> "$GITHUB_ENV"

      - name: Run unit tests and build debug and release APKs
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :twin:testDebugUnitTest :twin:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      # Debug APKs are now per-ABI (+ a universal one); upload them all.
      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cm-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload twin calculator APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-twin-apk
          path: twin/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cm-chat-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publish ONLY the two debug APKs (arm64 + arm32), renamed. Debug builds are
      # signed with the project's stable key (see build.gradle.kts) so they
      # install/upgrade in place. Release / universal / x86_64 are built for CI
      # coverage but NOT attached here.
      - name: Publish debug APKs to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1-build${{ github.run_number }}"
          D=app/build/outputs/apk/debug
          cp "$D/app-arm64-v8a-debug.apk"   "$RUNNER_TEMP/CM-Chat-arm64-debug.apk"
          cp "$D/app-armeabi-v7a-debug.apk" "$RUNNER_TEMP/CM-Chat-arm32-debug.apk"
          cp twin/build/outputs/apk/debug/twin-debug.apk "$RUNNER_TEMP/Calculator-twin-debug.apk"
          NOTES="$(cat <<'EOF'
          **Download the ONE file for your phone:**

          - **CM-Chat-arm64-debug.apk** — Modern phones (Ulefone Armor 22, Samsung, Moto G5s, basically any phone from the last several years).
          - **CM-Chat-arm32-debug.apk** — Older 32-bit phones only.

          Optional: **Calculator-twin-debug.apk** — a separate, plain calculator app (any phone). Tapping the same key 10 times opens CM-Chat; "reset" 20 times forgets that key.

          These are debug test builds signed with a stable key, so they install and upgrade in place.

          If install still fails, uninstall any older CM-Chat first.
          EOF
          )"
          gh release create "$TAG" \
            "$RUNNER_TEMP/CM-Chat-arm64-debug.apk" \
            "$RUNNER_TEMP/CM-Chat-arm32-debug.apk" \
            "$RUNNER_TEMP/Calculator-twin-debug.apk" \
            --title "CM-Chat $TAG" \
            --notes "$NOTES"
